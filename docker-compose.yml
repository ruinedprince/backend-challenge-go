x-api: &api
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy

services:
  # Three identical API processes for the local concurrency demonstration.
  # Distinct host ports let the script intentionally target each process.
  api-a:
    <<: *api
    ports:
      - "8080:8080"

  api-b:
    <<: *api
    ports:
      - "8082:8080"

  api-c:
    <<: *api
    ports:
      - "8083:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The API validates this internal issuer; exposing 8081 does not change it.
      KC_HOSTNAME: http://keycloak:8080
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  localstack:
    image: localstack/localstack:4.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  jaeger:
    image: jaegertracing/jaeger:2.6.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://challenge:challenge@postgres:5432/challenge?sslmode=disable
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
